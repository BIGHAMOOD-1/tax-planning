[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# ===== 智能税务筹划系统 =====
# 一键复现：pip install -e .   或   pip install -r requirements.txt
# 运行：python run_server.py   （浏览器打开 http://127.0.0.1:8000）
# 测试：pip install -e ".[dev]" ; pytest -q

[project]
name = "tax-planning-agent"
version = "1.0.0"
description = "智能税务筹划系统：可追溯证据链 + 多代理（Multi-Agent）税务分析"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "2026 北京市大学生数智会计创新应用竞赛参赛队" }]
keywords = ["tax", "multi-agent", "rag", "accounting", "llm"]

dependencies = [
    # —— 数据层 ——
    "pandas>=2.0",
    "openpyxl>=3.1",
    "pyarrow>=14.0",
    "PyYAML>=6.0",
    "numpy>=1.24",
    # —— 系统架构 / RAG ——
    "requests>=2.28",
    "scikit-learn>=1.3",
    "jieba>=0.42",
    "joblib>=1.3",
    "rank_bm25>=0.2",
    # —— 证据层（PDF 抽取）——
    "pdfplumber>=0.11",
    "PyMuPDF>=1.24",
    # —— 环境变量（.env 加载）——
    "python-dotenv>=1.0",
    # —— UI / API ——
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "python-multipart>=0.0.9",
    # —— 报告导出（PDF）——
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
icon = ["Pillow>=10.0"]          # 仅在重新生成图标时需要

[project.scripts]
tax-plan = "run_server:main"

[tool.setuptools]
packages = { find = { include = ["src*"] } }
py-modules = ["run_server"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["frontend", "data", "data_processed", "outputs", "knowledge", "validation", ".venv"]
