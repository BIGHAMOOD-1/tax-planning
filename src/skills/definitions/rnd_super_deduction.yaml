id: rnd_super_deduction
name: 研发费用加计扣除
direction: 研发筹划
version: "1.1"
effective_from: "2023-01-01"
effective_to: ""
goal: 先判断企业是否具备加计扣除资格，再将"会计口径研发投入"调整为"税法口径可加计扣除研发费用"，并估算税收影响
policies:
  - 财税〔2015〕119号 关于完善研究开发费用税前加计扣除政策的通知
  - 国家税务总局公告2015年第97号 关于企业研究开发费用税前加计扣除政策有关问题的公告
  - 财政部 税务总局 科技部公告2023年第7号 关于进一步完善研发费用税前加计扣除政策的公告
data_sources:
  - 研发投入情况表(213111405)
  - 研发费用明细(211127976)
  - 利润表(050312367)
  - 税项名义税率(204837437)

# ── 第一层：资格（Eligibility）────────────────────────────
eligibility:
  facts:
    - industry_name
    - rd_spend_sum
  conditions:
    - field: rd_spend_sum
      op: gt
      value: 0
      desc: 存在研发活动投入
    - field: industry_name
      op: not_in
      value: [烟草制造业, 住宿和餐饮业, 批发和零售业, 房地产业, 租赁和商务服务业, 娱乐业]
      desc: 不属于《通知》规定的不得加计扣除的负面清单行业

# ── 第二层：计算（Calculation）───────────────────────────
# 注意：会计口径研发投入 ≠ 税法口径可加计扣除研发费用。
# 需要经过"费用化/资本化划分 + 剔除不可加计项 + 其他相关费用10%限额"等调整。
calculation:
  calculator: rnd_super_deduction
  facts:
    - rd_spend_sum
    - nominal_tax_rate
  adjustments:
    - 资本化部分不计入当期加计扣除，形成无形资产后按成本 200% 摊销
    - 剔除不适用加计的支出（如常规性升级、社会科学研究、非直接相关费用等）
    - "其他相关费用不得超过可加计扣除研发费用总额的 10%"
    - 冲减已计入的特殊收入（下脚料、残次品、中间试制品等）
  evidence_required:
    - 研发支出辅助账（按研发项目与费用类型归集）
    - 研发费用构成明细（人员人工、直接投入、折旧、无形资产摊销、设计试验费、其他相关费用）
    - 费用化与资本化的划分依据
    - 研发项目立项决议、项目计划书
    - 特殊收入冲减明细
  amount_requires_evidence: true

risks:
  - 研发费用归集口径是否合规（人员人工、直接投入、折旧费用、无形资产摊销、新产品设计费、其他相关费用等）
  - 研发项目是否属于可加计范围，需留存立项决议、项目计划书、研发支出辅助账
  - '"其他相关费用"不得超过可加计扣除研发费用总额的 10%'
  - 负面清单行业（烟草制造、住宿餐饮、批发零售、房地产、租赁商务、娱乐）不得加计扣除
  - 已计入加计扣除的特殊收入（下脚料、残次品、中间试制品等）需冲减
  - 会计口径研发投入通常大于税法可加计口径，直接按会计口径估算会高估税收影响
output_schema:
  accounting_rd: 元，会计口径研发投入
  tax_eligible_rd: 元，税法口径可加计研发费用（估算）
  deduction_amount: 元，可加计扣除金额
  tax_saving: 元，估算节税额
rag_queries:
  - 研发费用加计扣除比例 100% 2023年第7号
  - 研发费用加计扣除归集范围 其他相关费用 10%
  - 研发费用加计扣除负面清单行业
