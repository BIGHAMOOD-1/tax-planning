    subject:
    - 研发费用税前加计扣除
    level: national
    conditions:
    - 企业开展研发活动中实际发生的研发费用，未形成无形资产计入当期损益的，在按规定据实扣除的基础上，再按照实际发生额的100%在税前加计扣除
    - 形成无形资产的，按照无形资产成本的200%在税前摊销
    title: 财政部 税务总局关于进一步完善研发费用税前加计扣除政策的公告
  国家税务总局 财政部公告2023年第11号:
    doc_no: 国家税务总局 财政部公告2023年第11号
    source: llm_candidate
    verification: PENDING
    metadata_confidence: MEDIUM
    effective_from: '2023-01-01'
    effective_to: ''
    status: null
    subject:
    - 企业所得税
    - 研发费用加计扣除
    level: 国家税务总局
    conditions:
    - 企业7月份预缴申报第2季度（按季预缴）或6月份（按月预缴）企业所得税时，能准确归集核算研发费用的，可以结合自身生产经营实际情况，自主选择就当年上半年研发费用享受加计扣除政策
    - 对7月份预缴申报期未选择享受优惠的企业，在10月份预缴申报或年度汇算清缴时能够准确归集核算研发费用的，可结合自身生产经营实际情况，自主选择在10月份预缴申报或年度汇算清缴时统一享受
    - 企业10月份预缴申报第3季度（按季预缴）或9月份（按月预缴）企业所得税时，能准确归集核算研发费用的，企业可结合自身生产经营实际情况，自主选择就当年前三季度研发费用享受加计扣除政策
    - 对10月份预缴申报期未选择享受优惠的企业，在年度汇算清缴时能够准确归集核算研发费用的，可结合自身生产经营实际情况，自主选择在年度汇算清缴时统一享受
    - 企业享受研发费用加计扣除优惠政策采取“真实发生、自行判别、申报享受、相关资料留存备查”的办理方式，由企业依据实际发生的研发费用支出，自行计算加计扣除金额，填报《中华人民共和国企业所得税月（季）度预缴纳税申报表（A类）》享受税收优惠，并根据享受加计扣除优惠的研发费用情况（上半年或前三季度）填写《研发费用加计扣除优惠明细表》（A107012）
    - 《研发费用加计扣除优惠明细表》（A107012）与规定的其他资料一并留存备查
    title: 国家税务总局 财政部关于优化预缴申报享受研发费用加计扣除政策有关事项的公告
  工信部联通装函〔2024〕60号:
    doc_no: 工信部联通装函〔2024〕60号
    source: llm_candidate
    verification: PENDING
    metadata_confidence: MEDIUM
    effective_from: '2023-01-01'
    effective_to: '2023-12-31'
    status: null
    subject:
    - 工业母机企业
    level: 国家级
    conditions:
    - 生产销售先进工业母机主机、关键功能部件、数控系统的工业母机企业
    - 2023年度申请优惠政策的企业具有劳动合同关系或劳务派遣、聘用关系的先进工业母机产品研究开发人员月平均人数占企业月平均职工总数的比例不低于15%
    - 2023年度申请优惠政策的企业研究开发费用总额占企业销售（营业）收入总额的比例不低于5%
    - 2023年度申请优惠政策的企业生产销售本通知规定的先进工业母机产品收入占企业销售（营业）收入总额的比例不低于60%，且企业收入总额不低于3000万元（含）
    title: 工业和信息化部 国家发展和改革委员会 财政部 国家税务总局关于开展2023年度享受研发费用加计扣除政策的工业母机企业清单制定工作的通知
